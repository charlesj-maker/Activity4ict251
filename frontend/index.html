<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Card Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>🍳 Recipe Card Manager</h1>
    <p>ICT251 Activity 4 — Single-Table CRUD App (SQLite + Node.js/Express)</p>
  </header>

  <main>
    <!-- Create / Edit form -->
    <section class="form-section" id="form-section">
      <h2 id="form-title">Add a New Recipe</h2>
      <form id="recipe-form">
        <input type="hidden" id="recipe-id">

        <div class="form-row">
          <label for="title">Title *</label>
          <input type="text" id="title" required placeholder="e.g. Grilled Chicken Salad">
        </div>

        <div class="form-row">
          <label for="category">Category</label>
          <select id="category">
            <option value="">-- Select --</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Dessert">Dessert</option>
          </select>
        </div>

        <div class="form-row">
          <label for="ingredients">Ingredients</label>
          <textarea id="ingredients" rows="2" placeholder="Comma-separated list"></textarea>
        </div>

        <div class="form-row">
          <label for="instructions">Instructions</label>
          <textarea id="instructions" rows="3" placeholder="Steps to prepare the recipe"></textarea>
        </div>

        <div class="form-row form-row-inline">
          <div>
            <label for="prep_time_minutes">Prep Time (minutes)</label>
            <input type="number" id="prep_time_minutes" min="0">
          </div>
          <div>
            <label for="servings">Servings</label>
            <input type="number" id="servings" min="0">
          </div>
        </div>

        <div id="form-message" class="form-message" role="status"></div>

        <div class="form-buttons">
          <button type="submit" id="submit-btn">Add Recipe</button>
          <button type="button" id="cancel-btn" hidden>Cancel Edit</button>
        </div>
      </form>
    </section>

    <!-- Recipe list -->
    <section class="list-section">
      <h2>All Recipes</h2>
      <div id="list-message" class="form-message" role="status"></div>
      <div class="table-wrapper">
        <table id="recipe-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Prep Time</th>
              <th>Servings</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="recipe-table-body">
            <!-- Rows inserted by app.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>Charles Makwembo — Student ID: 202509566 — ICT251 Web Technologies</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
